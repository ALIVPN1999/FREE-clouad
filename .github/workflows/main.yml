name: Linux GUI RDP (Tailscale)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. Install XFCE Desktop & XRDP Server
        run: |
          sudo apt-get update
          sudo apt-get install -y xfce4 xfce4-goodies xrdp curl wget unzip
          echo "xfce4-session" > ~/.xsession
          sudo systemctl enable xrdp
          sudo systemctl start xrdp

      - name: 2. Create Admin Account
        run: |
          sudo useradd -m -s /bin/bash PARSA124
          echo "PARSA124:PARSA@124" | sudo chpasswd
          sudo usermod -aG sudo PARSA124
          sudo adduser xrdp ssl-cert

      - name: 3. Setup XFEC Environment
        run: |
          sudo mkdir -p /home/PARSA124/Desktop/XFEC
          cd /home/PARSA124/Desktop/XFEC
          sudo wget -q https://github.com/v2fly/v2ray-core/releases/latest/download/v2ray-linux-64.zip -O xfec-core.zip || true
          sudo unzip -q xfec-core.zip || true
          sudo chown -R PARSA124:PARSA124 /home/PARSA124/Desktop

      - name: 4. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="$TAILSCALE_AUTHKEY" --hostname="github-ubuntu-rdp"
          
          sleep 5
          TS_IP=$(tailscale ip -4)
          
          echo ""
          echo "=================================================="
          echo "  >>> LINUX RDP SERVER IS READY! <<<"
          echo "  Tailscale IP : $TS_IP"
          echo "  Username     : PARSA124"
          echo "  Password     : PARSA@124"
          echo "  >> Open mstsc and connect to: $TS_IP"
          echo "=================================================="

      - name: 5. Keep Server Alive (6 Hours)
        run: |
          for i in {1..360}; do
            sleep 60
            echo "[$i/360] RDP Server active..."
          done
