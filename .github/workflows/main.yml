name: Lightweight Windows-like Desktop (XFCE + XRDP + Tailscale)

on:
  workflow_dispatch:

jobs:
  desktop-environment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XFCE Desktop & XRDP
        run: |
          sudo apt update
          sudo apt install -y xfce4 xfce4-goodies xrdp dbus-x11
          echo "xfce4-session" > ~/.xsession
          sudo adduser xrdp ssl-cert
          sudo systemctl enable xrdp
          sudo service xrdp restart

      - name: Create Remote User
        run: |
          sudo useradd -m -s /bin/bash PARSA
          echo "PARSA:PARSA@124" | sudo chpasswd
          sudo usermod -aG sudo PARSA
          echo "xfce4-session" | sudo tee /home/PARSA/.xsession
          sudo chown PARSA:PARSA /home/PARSA/.xsession

      - name: Install & Connect Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=$TAILSCALE_AUTHKEY --accept-routes

      - name: Print Connection Details & Keep Alive
        run: |
          echo "=================================================="
          echo "🚀 Desktop Environment Ready!"
          echo "=================================================="
          echo "📌 Tailscale IP:"
          tailscale ip -4
          echo "--------------------------------------------------"
          echo "👤 Username: PARSA"
          echo "🔑 Password: PARSA@124"
          echo "=================================================="
          sleep 21600
