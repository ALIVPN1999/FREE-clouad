name: Linux XFCE Tailscale Server

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:

      # ==========================================
      # 1. Update system
      # ==========================================
      - name: Update Linux
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get upgrade -y

      # ==========================================
      # 2. Install XFCE + XRDP
      # ==========================================
      - name: Install XFCE and XRDP
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xfce4-terminal \
            xrdp \
            dbus-x11 \
            policykit-1 \
            curl \
            wget \
            git \
            net-tools

      # ==========================================
      # 3. Create RDP user
      # ==========================================
      - name: Create RDP user
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          sudo useradd -m -s /bin/bash rdpuser || true

          echo "rdpuser:${RDP_PASSWORD}" | sudo chpasswd

          sudo usermod -aG sudo rdpuser
          sudo usermod -aG ssl-cert rdpuser

          sudo -u rdpuser bash -c 'echo "startxfce4" > ~/.xsession'
          sudo -u rdpuser chmod +x /home/rdpuser/.xsession

      # ==========================================
      # 4. Configure XRDP
      # ==========================================
      - name: Configure XRDP
        run: |
          sudo cp /etc/xrdp/startwm.sh /etc/xrdp/startwm.sh.backup || true

          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export DESKTOP_SESSION=xfce

          startxfce4
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh

          sudo sed -i 's/^max_bpp=.*/max_bpp=16/' /etc/xrdp/xrdp.ini || true
          sudo sed -i 's/^xserverbpp=.*/xserverbpp=16/' /etc/xrdp/xrdp.ini || true

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

          sleep 3

          sudo systemctl status xrdp --no-pager || true

      # ==========================================
      # 5. Install Tailscale
      # ==========================================
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      # ==========================================
      # 6. Start Tailscale
      # ==========================================
      - name: Start Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          sudo tailscaled \
            --state=/tmp/tailscaled.state \
            --socket=/tmp/tailscaled.sock \
            > /tmp/tailscaled.log 2>&1 &

          sleep 5

          sudo tailscale \
            --socket=/tmp/tailscaled.sock \
            up \
            --auth-key="${TS_AUTHKEY}" \
            --hostname="github-xfce-${GITHUB_RUN_ID}"

          sleep 5

      # ==========================================
      # 7. Show connection information
      # ==========================================
      - name: Show Server Information
        run: |
          echo ""
          echo "=============================================="
          echo "        XFCE + XRDP + TAILSCALE"
          echo "=============================================="
          echo ""

          echo "TAILSCALE IP:"
          sudo tailscale \
            --socket=/tmp/tailscaled.sock \
            ip -4

          echo ""
          echo "TAILSCALE STATUS:"
          sudo tailscale \
            --socket=/tmp/tailscaled.sock \
            status

          echo ""
          echo "XRDP:"
          sudo systemctl status xrdp --no-pager || true

          echo ""
          echo "PORT 3389:"
          sudo ss -lntp | grep 3389 || true

          echo ""
          echo "RDP USER:"
          echo "rdpuser"

          echo ""
          echo "=============================================="

      # ==========================================
      # 8. Keep server alive
      # ==========================================
      - name: Keep Server Running
        run: |
          echo "Server is running..."
          echo "Use the Tailscale IP shown above."
          echo ""

          while true; do
            echo "Server alive: $(date)"
            sleep 300
          done
