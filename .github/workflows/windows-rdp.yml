name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable Remote Desktop
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1

          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

      - name: Create RDP User
        shell: powershell
        run: |
          $Password = ConvertTo-SecureString "PARSA@124" -AsPlainText -Force

          if (-not (Get-LocalUser -Name "PARSA124" -ErrorAction SilentlyContinue)) {
              New-LocalUser `
                -Name "PARSA124" `
                -Password $Password `
                -PasswordNeverExpires
          } else {
              Set-LocalUser `
                -Name "PARSA124" `
                -Password $Password
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "PARSA124" `
            -ErrorAction SilentlyContinue

      - name: Download Cloudflared
        shell: powershell
        run: |
          Invoke-WebRequest `
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile "C:\cloudflared.exe"

      - name: Start Cloudflare Tunnel
        shell: powershell
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          Start-Process `
            -FilePath "C:\cloudflared.exe" `
            -ArgumentList "tunnel --no-autoupdate run --token $env:CLOUDFLARE_TUNNEL_TOKEN" `
            -WindowStyle Hidden

          Start-Sleep -Seconds 10

          Write-Host "========================================"
          Write-Host "       CLOUDFLARE RDP IS READY"
          Write-Host "========================================"
          Write-Host "Hostname: rdp.pirpesar124.dpdns.org"
          Write-Host "Username: PARSA124"
          Write-Host "========================================"

      - name: Check Cloudflared
        shell: powershell
        run: |
          Start-Sleep -Seconds 5
          Get-Process cloudflared -ErrorAction SilentlyContinue

      - name: Keep Server Alive
        shell: powershell
        run: |
          for ($i = 1; $i -le 340; $i++) {
              Start-Sleep -Seconds 60
              Write-Host "Server running: $i/340 minutes"
          }
